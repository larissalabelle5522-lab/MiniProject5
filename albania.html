<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Next Stop</title>

    <link rel="stylesheet" href="css/places.css">
</head>

   <header>
        <h1>NextStop</h1>
        <div class="search-container">
        <input type="text" id="placeSearch" placeholder="Search places or categories..">
            <button type="button" id="searchButton">Submit</button>
            <button type="button" id="clearSearch">Clear</button>
            <p id="searchMessage" aria-live="polite"></p>
        </div>
            
        <div class="filters" id="filters">
            <button class="active" data-category="All">All places</button>
            <button data-category="beach">Beach Trip</button>
            <button data-category="out-of-state">Out of State</button>
            <button data-category="hiking-trips">Hiking Trips</button>
        </div>
        
    </header>

<body>
        <article class="place-card" data-category="hiking-trips" data-search="albania balkans region hiking trips historic mountains">
            <img src="images/albania.jpeg" alt="Mountain scenery in Albania" class="destination-image">
            <div class="card-content">
                <h2 class="location">Albania/Balkans Region</h2>
                <p class="card-description"><b>Activities:</b> Mediterranean beaches along the Albanian Riviera, historic Ottoman towns, and dramatic<br>mountain scenery.</p>
                <span class="price-label">Estimated Cost:</span>
                <p class="price">$80-$105 per day (including lodging and local food)</p>
            </div>
        </article>
    </body>

<body>
    <nav>
        <a href="homepage.html">⬅ Back to Homepage</a>
    </nav>

<script src="javascript" href="js/page.js" defer></script>
</body>
</html>
