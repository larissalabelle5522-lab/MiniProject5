<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Next Stop</title>

    <link rel="stylesheet" href="css/places.css">
    <script src="javascript" href="js/page.js"></script>
</head>

   <header>
        <h1>NextStop</h1>
        <div class="search-container">
        <input type="text" id="placeSearch" placeholder="Search places or categories..">
            <button type="button" id="searchButton">Submit</button>
            <button type="button" id="clearSearch">Clear</button>
            <p id="searchMessage" aria-live="polite"></p>
        </div>
            
        <div class="filters" id="filters">
            <button class="active" data-category="All">All places</button>
            <button data-category="beach">Beach Trip</button>
            <button data-category="out-of-state">Out of State</button>
            <button data-category="hiking-trips">Hiking Trips</button>
        </div>
        
    </header>

    <body>
        <article class="place-card" data-category="historic" data-search="montreal canada historic bakeries">
            <div class="card-content">
                <img src="images/montreal.jpeg" alt="Montreal streets" class="destination-image">
                <h2 class="location">Montreal, Canada</h2>
                    <p class="card-description">Montreal delivers French-speaking culture, cobblestone historic streets, and world-class bakeries.</p>
                    <span class="price-label">Estimated Cost:</span>
                <p class="price">$360-$860</p>
            </div>
        </article>
    </body>
