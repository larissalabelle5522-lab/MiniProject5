<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Next Stop</title>

    <link rel="stylesheet" href="css/places.css">
    <script src="javascript" href="js/page.js"></script>
</head>

   <header>
        <h1>NextStop</h1>
        <div class="search-container">
        <input type="text" id="placeSearch" placeholder="Search places or categories..">
            <button type="button" id="searchButton">Submit</button>
            <button type="button" id="clearSearch">Clear</button>
            <p id="searchMessage" aria-live="polite"></p>
        </div>
  
          
        <div class="filters" id="filters">
            <button class="active" data-category="All">All places</button>
            <button data-category="beach">Beach Trip</button>
            <button data-category="out-of-state">Out of State</button>
            <button data-category="hiking-trips">Hiking Trips</button>
        </div>
    </header>

    <body>
        <article class="place-card" data-category="out-of-state" data-search="costa rica rainforest volcanoes forest">
            <img src="images/Costa-Rica-waterfall-family-main.webp" alt="Waterfall in Costa Rica" class="destination-image">
            <div class="card-content">
                <h2 class="location">Costa Rica</h2>
                <p class="card-description">Lush rainforest, active volcanoes, cloud forests, and incredible wildlife.</p>
                <p>Costa Rica can be pricey in peak dry winter, but traveling during green seasons brings dramatic drops in hotel and resort prices.</p>
            </div>
        </article>
    </body>
