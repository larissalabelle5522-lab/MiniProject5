<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Next Stop</title>

    <link rel="stylesheet" href="css/places.css">
    <script src="javascript" href="js/page.js" defer></script>
</head>

   <header>
        <h1>NextStop</h1>
        <div class="search-container">
        <input type="text" id="placeSearch" placeholder="Search places or categories..">
            <button type="button" id="searchButton">Submit</button>
            <button type="button" id="clearSearch">Clear</button>
            <p id="searchMessage" aria-live="polite"></p>
        </div>
            
        <div class="filters" id="filters">
            <button class="active" data-category="All">All places</button>
            <button data-category="beach">Beach Trip</button>
            <button data-category="out-of-state">Out of State</button>
            <button data-category="hiking-trips">Hiking Trips</button>
        </div>
        
    </header>

<body>
        <article class="place-card" data-category="out-of-state" data-search="san antonio texas riverwalk history riverboat pearl district">
            <img src="images/sanantonioTexas.jpg" alt="San Antonio River Walk" class="destination-image">
                <div class="card-content">
                    <h2 class="location">San Antonio, Texas</h2>
                    <p class="description">Affordable and fun with beautiful historic sites, riverboat cruises, and the lively Pearl District.</p>
                    <span class="price-label">Cost:</span>
                    <p class="price">$60-$80</p>
                </div>
        </article>
</body>
